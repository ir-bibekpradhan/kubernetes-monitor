name: PR Title Check + Docker Build

on:
  workflow_dispatch:

jobs:
  pr-title-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v2

      # Enable Docker BuildKit (important for modern builds)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # ✅ Build Docker image
      - name: Build Docker image
        run: docker build -t test-image .

      # Optional: run container to verify it works
      - name: Test container
        run: docker run --rm test-image --help || true

      # Keep your PR title check (won’t really run on manual trigger, but harmless)
      - name: Check PR Title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
            ci
            build
            revert
          requireScope: false
